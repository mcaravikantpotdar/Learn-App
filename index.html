<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concept Builder | Learning Mode</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main Application Screen -->
    <div id="quizScreen" class="screen active">
        
        <!-- Header & Top Navigation -->
        <div class="quiz-header">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid #f1f5f9;">
                <button id="topHomeBtn" class="btn-icon" title="Home">🏠 Home</button>
                <div style="flex:1; margin:0 10px; text-align:center;">
                    <h2 id="chapterTitle" class="chapter-title" style="margin: 0; border: none; padding: 0;">Loading Module...</h2>
                </div>
                <button id="topQuitBtn" class="btn-icon btn-danger-text" title="Quit">🏁 Finish</button>
            </div>
            
            <div class="quiz-stats-row">
                <div class="header-left">
                    <div class="stat-badge">
                        <span class="stat-label">Progress</span>
                        <span class="stat-value"><span id="currentUnitNum">0</span>/<span id="totalUnitsNum">0</span></span>
                    </div>
                </div>
                <div class="header-right">
                    <div class="stat-badge score-badge">
                        <span class="stat-label">Mastery Points</span>
                        <span class="stat-value"><span id="masteryScore">0</span>/<span id="maxScore">0</span></span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Interactive Unit Navigation Grid -->
        <div class="question-grid" id="unitGrid"></div>

        <!-- Core Learning & Challenge Area -->
        <div class="question-area">
            
            <!-- Bilingual Track Toggle -->
            <div class="lang-toggle-container">
                <button id="btn-en" class="lang-btn active">English [10 pts]</button>
                <button id="btn-hi" class="lang-btn">हिंदी [10 pts]</button>
            </div>

            <!-- Phase 1: Teach (Theory & Media) -->
            <section class="lesson-card" id="lesson-card">
                <h3 id="lesson-title"></h3>
                <div class="media-viewport" id="media-container" style="display: none;"></div>
                <div class="media-caption" id="media-caption"></div>
                <div class="theory-content" id="lesson-theory"></div>
            </section>

            <!-- Phase 2: Reconstruct (Interactive Assembly) -->
            <div class="challenge-board">
                <div class="prompt-bar" id="challenge-prompt"></div>
                
                <!-- Target Zone (Where the sentence is assembled) -->
                <div class="assembly-line" id="target-zone"></div>

                <!-- Fragment Bank (Where shuffled words start) -->
                <div class="fragment-pool" id="fragment-bank"></div>
                
                <!-- Feedback / Key Takeaway Message -->
                <div class="feedback-banner" id="feedback-banner" style="display: none;"></div>

                <!-- Action Controls -->
                <div class="quiz-controls">
                    <button id="prevBtn" class="btn-secondary">← Back</button>
                    <div style="display: flex; gap: 8px;">
                        <button id="hintBtn" class="btn-secondary" style="color: #0ea5e9; border-color: #bae6fd;">💡 Hint</button>
                        <button id="btn-submit" class="btn-primary" disabled>Check Answer</button>
                        <button id="nextBtn" class="btn-primary" style="background:#10b981;">Next Unit →</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
