<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LearnApp - Interactive Pedagogical Platform</title>

    <!-- External Fonts & KaTeX Engine -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

    <!-- Application Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Loading Indicator Overlay -->
    <div id="loadingSpinner" class="loading-overlay">
        <div class="spinner-core"></div>
        <div class="spinner-text">Syncing with Repository & Cloud Database...</div>
    </div>

    <div class="app-viewport">

        <!-- ======================================================== -->
        <!-- SCREEN 1: UPLOAD / CURRICULUM SELECTION & AUTHENTICATION -->
        <!-- ======================================================== -->
        <main id="uploadScreen" class="screen-view active">
            <header class="app-masthead">
                <div class="masthead-badge">CBSE / NCERT Interactive Workbench</div>
                <h1 class="masthead-title">LearnApp</h1>
                <p class="masthead-subtitle">Master syntax, logical architectures, and algorithms through bilingual interactive sequencing.</p>
            </header>

            <div id="errorMessage" class="system-banner error-banner" style="display:none;"></div>

            <section class="portal-card">
                <!-- 1. Student Verification Section (Sheet2 Lookup) -->
                <div class="portal-section">
                    <label class="form-label" for="studentIdInput">Student Authentication</label>
                    <div class="auth-input-group">
                        <input type="text" id="studentIdInput" class="form-control text-uppercase" placeholder="Enter Student ID (e.g., STU101)" autocomplete="off">
                        <button type="button" id="verifyStudentBtn" class="btn btn-secondary">Verify</button>
                    </div>
                    <div id="authStatusBadge" class="auth-status-badge unverified">
                        <span class="status-indicator"></span>
                        <span id="authStatusText">Enter your Student ID to verify access</span>
                    </div>
                </div>

                <div class="form-divider"></div>

                <!-- 2. Curriculum Cascading Selectors -->
                <div class="portal-section">
                    <div class="form-group">
                        <label class="form-label" for="classSelect">Target Class</label>
                        <select id="classSelect" class="form-control">
                            <option value="" disabled selected>Loading available classes...</option>
                        </select>
                    </div>

                    <div id="subjectGroup" class="form-group" style="display:none;">
                        <label class="form-label" for="subjectSelect">Discipline / Subject</label>
                        <select id="subjectSelect" class="form-control">
                            <option value="" disabled selected>Choose Subject...</option>
                        </select>
                    </div>

                    <div id="lessonGroup" class="form-group" style="display:none;">
                        <label class="form-label">Available Interactive Chapters</label>
                        <div id="quizList" class="curriculum-item-grid"></div>
                    </div>
                </div>

                <div class="portal-actions">
                    <button type="button" id="startQuiz" class="btn btn-primary btn-large btn-block" disabled>
                        🚀
